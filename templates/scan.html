<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสแกนใบหน้า</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #212121; font-family: 'Kanit', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; color: white; margin: 0; }
        .scan-container { width: 90%; max-width: 500px; text-align: center; }
        .scan-header { font-weight: 600; color: #198754; margin-bottom: 10px; }
        .camera-box { border: 2px solid #ffc107; border-radius: 12px; padding: 5px; background: #000; margin-bottom: 20px; position: relative;}
        /* เปลี่ยนมาใช้ video เพื่อเล่นภาพจากกล้องเว็บแคมผ่านเบราว์เซอร์ */
        .camera-box video { width: 100%; border-radius: 8px; transform: scaleX(-1); /* สลับซ้ายขวาให้เหมือนกระจก */ }
        
        #statusBox {
            background: #198754; color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px;
            font-size: 1.2rem; font-weight: 600; display: none; border: 2px solid #fff;
            box-shadow: 0 0 15px rgba(25, 135, 84, 0.7);
            transition: all 0.3s ease;
        }
        .btn-back { border: 1.5px solid #fff; background: transparent; color: white; padding: 10px 30px; border-radius: 8px; font-weight: 600; }
        .btn-back:hover { background: white; color: #000; }
    </style>
</head>
<body>

    <div class="scan-container">
        <h4 class="scan-header">📸 ระบบสแกนใบหน้าแบบเรียลไทม์</h4>
        <p class="text-white-50">กรุณาจัดใบหน้าให้อยู่ในกรอบเพื่อบันทึกเวลาเข้าเรียน</p>
        
        <div id="statusBox"></div>
        
        <div class="camera-box">
            <!-- ซ่อน canvas ไว้ประมวลผล -->
            <video id="videoElement" autoplay playsinline></video>
            <canvas id="canvasElement" style="display: none;"></canvas>
        </div>

        <a href="/dashboard" class="btn btn-back">🏠 กลับเมนูหลัก</a>
    </div>

    <script>
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('canvasElement');
        const ctx = canvas.getContext('2d');

        // --- ส่วนจัดการสถานะ Popup ---
        let knownScannedIds = new Set(); // เก็บ ID ที่เคยสแกนไปแล้วของวันนี้
        let lastLoggedId = "";
        let isShowingPopup = false;
        let currentPopupId = null;
        let popupTimeout = null;

        // ฟังก์ชันอเนกประสงค์สำหรับแสดงกล่องข้อความ
        function showPopup(type, title, text, sid = null) {
            // ป้องกันไม่ให้ข้อความเตือนสแกนซ้ำ ไปทับข้อความสีเขียว (สแกนสำเร็จ) ที่เพิ่งขึ้น
            if (isShowingPopup && currentPopupId === sid && type === "warning") return;
            // ป้องกันกล่อง Error เด้งรัวๆ
            if (isShowingPopup && type === "error") return;

            isShowingPopup = true;
            currentPopupId = sid;
            const box = document.getElementById('statusBox');

            if (type === "success") {
                box.style.background = "#198754"; // สีเขียว
                box.style.boxShadow = "0 0 15px rgba(25, 135, 84, 0.7)";
            } else if (type === "error") {
                box.style.background = "#dc3545"; // สีแดง
                box.style.boxShadow = "0 0 15px rgba(220, 53, 69, 0.7)";
            } else if (type === "warning") {
                box.style.background = "#fd7e14"; // สีส้ม
                box.style.boxShadow = "0 0 15px rgba(253, 126, 20, 0.7)";
            }

            box.innerHTML = `
                <div style="font-size: 1.5rem;">${title}</div>
                <div style="font-size: 1.1rem; margin-top: 5px;">${text}</div>
            `;
            box.style.display = 'block';

            if(popupTimeout) clearTimeout(popupTimeout);
            popupTimeout = setTimeout(() => {
                box.style.display = 'none';
                isShowingPopup = false;
                currentPopupId = null;
            }, 3000);
        }

        // ดึงข้อมูลครั้งแรกตอนเปิดหน้าเว็บ เพื่อจำว่าวันนี้ใครสแกนไปแล้วบ้าง
        fetch('/api/attendance-logs')
            .then(res => res.json())
            .then(logs => {
                logs.forEach(log => knownScannedIds.add(log.student_id));
                if (logs.length > 0) lastLoggedId = logs[0].student_id;
            });

        // ขออนุญาตเปิดกล้องเว็บแคม
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(function(stream) {
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    setInterval(sendFrameToServer, 1000); 
                };
            })
            .catch(function(err) {
                console.error("Error accessing camera: ", err);
                alert("ไม่สามารถเข้าถึงกล้องได้ กรุณากดอนุญาตให้เบราว์เซอร์ใช้งานกล้องเว็บแคม");
            });

        // ฟังก์ชันแคปภาพจากวิดีโอส่งไปให้ Python ประมวลผล
        function sendFrameToServer() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = canvas.toDataURL('image/jpeg', 0.8);
                
                fetch('/api/process-frame', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: imageData })
                })
                .then(response => response.json())
                .then(data => {
                    const sid = data.student_id;
                    
                    if (sid === "ไม่พบข้อมูลในระบบ") {
                        showPopup("error", "❌ ไม่พบข้อมูลในระบบ!", "กรุณาติดต่อครูเพื่อลงทะเบียนใบหน้า", "unknown");
                    } 
                    else if (sid) {
                        // 🟢 ถ้ารหัสนี้มีในระบบ และ เคยสแกนไปแล้ววันนี้
                        if (knownScannedIds.has(sid)) {
                            showPopup("warning", "⚠️ สแกนซ้ำ!", `รหัส ${sid} สแกนไปแล้ววันนี้`, sid);
                        }
                    }
                })
                .catch(err => console.error("Error sending frame: ", err));
            }
        }

        // --- ส่วนที่ 2: ดึงประวัติการเช็คชื่อมาโชว์ Popup สีเขียวสำหรับคนใหม่ ---
        setInterval(() => {
            fetch('/api/attendance-logs')
                .then(response => response.json())
                .then(logs => {
                    if (logs.length > 0) {
                        const lastLog = logs[0];
                        
                        // ถ้าเจอประวัติใหม่ล่าสุดที่ไม่ซ้ำกับตัวแปรที่จำไว้
                        if (lastLog.student_id !== lastLoggedId) {
                            lastLoggedId = lastLog.student_id;
                            knownScannedIds.add(lastLog.student_id); // บันทึกว่าคนนี้สแกนแล้ว
                            
                            showPopup(
                                "success", 
                                "✅ เช็คชื่อสำเร็จ!", 
                                `${lastLog.name}<br><small style="font-size: 0.9rem; opacity: 0.9;">รหัส: ${lastLog.student_id} | แผนก: ${lastLog.department}</small>`, 
                                lastLog.student_id
                            );
                        }
                    }
                });
        }, 1000); 
    </script>
</body>
</html>
