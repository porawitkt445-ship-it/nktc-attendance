<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สแกนผ่านมือถือ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #212121; font-family: 'Kanit', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; color: white; margin: 0; }
        .scan-container { width: 90%; max-width: 500px; text-align: center; }
        .camera-box { border: 3px solid #0dcaf0; border-radius: 12px; padding: 5px; background: #000; margin-bottom: 15px; }
        #video { width: 100%; border-radius: 8px; }
        .mirror { transform: scaleX(-1); }
        
        #statusBox { 
            background: #198754; color: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; 
            display: none; font-weight: 600; border: 2px solid #fff; 
            box-shadow: 0 0 15px rgba(25, 135, 84, 0.7);
            transition: all 0.3s ease;
        }
        .scanning-text { color: #ffc107; font-size: 1.1rem; margin-bottom: 10px; }
        .btn-action { width: 100%; padding: 12px; border-radius: 8px; font-weight: 600; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="scan-container">
        <h4 class="text-info fw-bold">📱 สแกนผ่านกล้องมือถือ</h4>
        <div id="statusBox"></div>
        <div id="loadingText" class="scanning-text">กำลังเตรียมกล้อง...</div>
        
        <div class="camera-box">
            <video id="video" autoplay playsinline muted></video>
        </div>
        
        <button id="switchBtn" class="btn btn-warning btn-action">🔄 สลับกล้องหน้า/หลัง</button>
        <a href="/dashboard" class="btn btn-outline-light btn-action">🏠 กลับหน้าหลัก</a>
        
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <!-- 🟢 เพิ่มไฟล์เสียงแจ้งเตือนตอนสแกนผ่าน -->
    <audio id="successSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusBox = document.getElementById('statusBox');
        const loadingText = document.getElementById('loadingText');
        const switchBtn = document.getElementById('switchBtn');
        const successSound = document.getElementById('successSound'); // 🟢 ดึงเสียงมาใช้
        
        let currentFacingMode = "user"; 
        let streamReference = null;
        let isSuccess = false;
        let isSending = false;

        let knownScannedIds = new Set();
        let lastLoggedId = ""; 

        fetch('/api/attendance-logs')
            .then(res => res.json())
            .then(logs => {
                logs.forEach(log => knownScannedIds.add(log.student_id));
                if (logs.length > 0) lastLoggedId = logs[0].student_id;
            })
            .catch(err => console.error("Error fetching logs: ", err));

        function startCamera(mode) {
            if (streamReference) {
                streamReference.getTracks().forEach(track => track.stop());
            }

            navigator.mediaDevices.getUserMedia({ video: { facingMode: mode } })
            .then(stream => { 
                streamReference = stream;
                video.srcObject = stream; 
                loadingText.innerText = "กำลังสแกนใบหน้า...";
                
                if (mode === "user") video.classList.add('mirror');
                else video.classList.remove('mirror');
            })
            .catch(err => { 
                loadingText.innerHTML = `<span class="text-danger">เปิดกล้องไม่ได้: ${err.name}</span>`;
                console.error("Camera Error:", err);
            });
        }

        switchBtn.addEventListener('click', () => {
            currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
            startCamera(currentFacingMode);
        });

        startCamera(currentFacingMode);

        setInterval(() => {
            if (video.videoWidth === 0 || isSuccess || isSending) return;
            isSending = true;
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            
            fetch('/api/process-frame', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ image: canvas.toDataURL('image/jpeg', 0.5) })
            })
            .then(r => r.json())
            .then(data => {
                isSending = false;
                const sid = data.student_id;
                
                if (sid === "ไม่พบข้อมูลในระบบ") {
                    statusBox.innerHTML = `❌ ไม่พบข้อมูลในระบบ!`;
                    statusBox.style.background = "#dc3545"; 
                    statusBox.style.boxShadow = "0 0 15px rgba(220, 53, 69, 0.7)";
                    statusBox.style.display = 'block';
                    
                    setTimeout(() => { 
                        statusBox.style.display = 'none'; 
                    }, 2000);
                }
                else if (sid && sid !== "Unknown") {
                    // ไม่แจ้งเตือนคนสแกนซ้ำตรงนี้ ปล่อยให้มันเงียบๆ ไป
                    if (!knownScannedIds.has(sid)) {
                        isSuccess = true;
                        loadingText.style.display = 'none';
                        
                        // ถ้ารหัสนี้ยังไม่เคยสแกน ให้อัปเดตสถานะและเปิดเสียง
                        setTimeout(() => checkLatestStatusAndAlert(sid), 500); 
                    }
                }
            })
            .catch(err => { isSending = false; });
        }, 800);

        // 🟢 ฟังก์ชันดึงสถานะล่าสุดมาดูว่า "มาเรียน" หรือ "สาย"
        function checkLatestStatusAndAlert(scannedSid) {
            fetch('/api/attendance-logs')
                .then(response => response.json())
                .then(logs => {
                    if (logs.length > 0) {
                        const lastLog = logs[0];
                        
                        // ตรวจสอบว่าคนที่เพิ่งสแกนตรงกับข้อมูลล่าสุดในฐานข้อมูลหรือไม่
                        if (lastLog.student_id === scannedSid) {
                            
                            // 🟢 เล่นเสียงแจ้งเตือน
                            successSound.currentTime = 0;
                            successSound.play().catch(e => console.log("Audio Error:", e));

                            // 🟢 กำหนดสีและข้อความตามสถานะ (มาเรียน = เขียว, สาย = ส้ม)
                            if (lastLog.status === 'สาย') {
                                statusBox.innerHTML = `⏰ เช็คชื่อ (มาสาย)<br><span style="font-size: 1rem; font-weight: normal;">${lastLog.name} (รหัส: ${scannedSid})</span>`;
                                statusBox.style.background = "#fd7e14"; 
                                statusBox.style.boxShadow = "0 0 15px rgba(253, 126, 20, 0.7)";
                            } else {
                                statusBox.innerHTML = `✅ เช็คชื่อสำเร็จ!<br><span style="font-size: 1rem; font-weight: normal;">${lastLog.name} (รหัส: ${scannedSid})</span>`;
                                statusBox.style.background = "#198754"; 
                                statusBox.style.boxShadow = "0 0 15px rgba(25, 135, 84, 0.7)";
                            }

                            statusBox.style.display = 'block';
                            knownScannedIds.add(scannedSid); // บันทึกลงระบบกันสแกนซ้ำ

                            setTimeout(() => { 
                                statusBox.style.display = 'none'; 
                                loadingText.style.display = 'block'; 
                                isSuccess = false; 
                            }, 3000);
                        }
                    }
                });
        }
    </script>
</body>
</html>
